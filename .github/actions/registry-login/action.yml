name: registry-login
description: >-
  Logs the container engine in to the image registry (ADR-0021). Demo: GHCR with the workflow's
  GITHUB_TOKEN (the calling job needs `packages: read` to pull, `packages: write` to push).
  Enterprise: JFrog Artifactory through GitHub OIDC (ADR-0021) — stubbed below.
inputs:
  registry:
    description: >-
      Registry host (ghcr.io in the demo; artifactory.<company>.com in the enterprise). Empty: the host of the
      registry in platform.yml (ADR-0030).
    required: false
    default: ''
  mode:
    description: "'token' (username + password/token) or 'oidc' (GitHub OIDC → registry identity; not implemented)."
    required: false
    default: token
  username:
    description: User name for token mode.
    required: false
    default: ${{ github.actor }}
  password:
    description: Password or token for token mode.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Registry host
      id: host
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        if [[ -z $REGISTRY ]]; then
          # The registry of platform.yml: a plain top-level line, read without yq (a job container may lack it).
          REGISTRY=$(awk '/^registry:/ { sub(/^registry:[ \t]*/, ""); sub(/#.*$/, ""); sub(/[ \t]+$/, ""); print; exit }' \
            "$GITHUB_WORKSPACE/platform.yml" 2>/dev/null || true)
          REGISTRY=${REGISTRY%%/*}
        fi
        [[ $REGISTRY =~ ^[a-z0-9.-]+(:[0-9]+)?$ ]] ||
          { echo "::error title=registry-login::no registry host: give the registry input, or a plain 'registry: <host>/<namespace>' line in platform.yml (ADR-0030)"; exit 1; }
        echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
    - name: OIDC login (stub)
      if: inputs.mode == 'oidc'
      shell: bash
      env:
        REGISTRY: ${{ steps.host.outputs.registry }}
      run: |
        # TODO(ADR-0021): enterprise path, not built in the demo. The calling job grants `id-token: write`;
        # this step requests the job's OIDC token (ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN, audience set by
        # the JFrog OIDC integration), exchanges it at the Artifactory token endpoint for a short-lived
        # access token scoped by the claims (repository, ref, environment) and logs in with it:
        #   jf config add --url "https://$REGISTRY" --oidc-provider-name github --oidc-audience ... ;
        #   docker login "$REGISTRY" --username <identity> --password-stdin <<<"$ACCESS_TOKEN"
        echo "::error title=registry-login::mode 'oidc' is a stub (TODO(ADR-0021)); use mode 'token' for $REGISTRY"
        exit 1
    - name: Unknown mode
      if: inputs.mode != 'oidc' && inputs.mode != 'token'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        echo "::error title=registry-login::unknown mode '$MODE' (expected token or oidc)"
        exit 1
    - name: Token login
      if: inputs.mode == 'token'
      uses: docker/login-action@v4
      with:
        registry: ${{ steps.host.outputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
