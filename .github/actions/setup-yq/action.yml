name: setup-yq
description: >-
  mikefarah yq v4 at the version pinned in .github/versions.env, for every step that reads platform.yml or a flow's
  workflows-config.yml (ADR-0021, ADR-0030). A yq already on PATH at exactly that version is kept; any other —
  GitHub-hosted runners carry another v4, a bare runner may have none or the Python wrapper of the same name — is
  shadowed by the release binary, checked against the SHA-256 the release publishes. The logic is
  scripts/ci/setup-yq.sh, the same on a laptop; this action only prepends the install directory to PATH for the
  later steps. Behind the company's JFrog, the repository variable YQ_DOWNLOAD_BASE names the generic remote of the
  GitHub releases: every workflow puts it in its env (a composite action cannot read `vars` itself), and the
  base-url input overrides it. Linux runners, amd64 or arm64. Needs a checkout holding scripts/ci.
inputs:
  base-url:
    description: "Where the release assets are, <base-url>/<version>/yq_linux_<arch>. Empty: env YQ_DOWNLOAD_BASE (the workflows set it from the repository variable of that name), else github.com."
    required: false
    default: ''
outputs:
  version:
    description: The yq version on PATH.
    value: ${{ steps.setup.outputs.version }}
runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
      run: |
        set -euo pipefail
        script="$GITHUB_WORKSPACE/scripts/ci/setup-yq.sh"
        [[ -f $script ]] || { echo "::error title=setup-yq::$script not found: the checkout must include scripts/ci (ADR-0021)"; exit 1; }
        args=()
        [[ -z $BASE_URL ]] || args+=(--base-url "$BASE_URL")
        version=$(bash "$script" ${args[@]+"${args[@]}"})
        echo "version=$version" >> "$GITHUB_OUTPUT"
