# Affected-subproject detection map (ADR-0022).
#
# Read by .github/actions/affected-matrix through scripts/ci/affected.py; run the script locally to see
# what CI will build and test for your branch:  python3 scripts/ci/affected.py --base origin/main
#
# Glob syntax: `**` spans directories (also zero of them), `*` and `?` stay inside one path segment.
# Every changed path is classified by the FIRST section that matches, in this order:
#   docs → config → shared → a project's own directory → (no match: treated as shared, so an unmapped file
#   can never silently skip the tests it affects).
# The projects are not listed here: scripts/ci/projects.py derives them, whether each has an image and
# integration tests, and the directory that selects it, from the build files (ADR-0031). A new app needs
# no edit here. `base-images` and `deploy-test` are flags instead: any matching path raises them, whatever
# its class.
schema: 1

# Nothing to build or test: when every changed path is here, the run is "docs-only" (ADR-0022).
docs:
  - "docs/**"
  # Markdown by location, not "**/*.md": a skill's SKILL.md under .claude/ is shared tooling (ADR-0043), checked by
  # the lint job, and an unlisted location counts as shared, which is the safe side.
  - "*.md"
  - "apps/**/*.md"
  - "config/**/*.md"
  - "framework/**/*.md"
  - "test-infra/**/*.md"
  - "build-logic/**/*.md"
  - "scripts/**/*.md"
  - "gradle/**/*.md"
  - ".github/**/*.md"
  - "LICENSE"
  - ".gitignore"
  - ".gitattributes"
  - ".editorconfig"
  - "renovate.json"
  - "release-please-config.json"
  - ".release-please-manifest.json"

# Config tree: config-lint only — no Gradle build, no image (ADR-0022).
# On main a config-only merge still runs the whole pipeline and deploy-dev (ADR-0027).
config:
  - "config/**"

# Shared inputs: any change here means "everything" (full=true, ADR-0022).
shared:
  - "framework/**"
  - ".claude/**"                     # the skills and their templates: shared tooling, checked by the lint job (ADR-0043)
  - "build-logic/**"
  - "gradle/**"
  - "gradlew"
  - "gradlew.bat"
  - "*.gradle.kts"
  - "gradle.properties"
  - "platform.yml"
  - "docker/**"                      # the shared spring-boot.Dockerfile and entrypoint.sh (ADR-0009)
  - "**/Dockerfile"
  - "**/*.Dockerfile"
  - "**/.dockerignore"
  - "test-infra/**"
  - "scripts/**"
  - ".github/**"
  - ".hadolint.yaml"

# Company base images (ADR-0009) are built and published outside this repository; this repository only
# consumes <registry>/base/* (platform.yml), so no path raises the flag.
base-images: []

# Kind deployment test (ADR-0019, ADR-0022): `deploy-test` is true when `full` is, or when a path
# here changed — the charts, the config tree, the kind tier, the Helm deploy scripts and their actions —
# or the directory of the app the test deploys, platform.yml's reference_app, which affected.py adds.
# pr.yml then runs `kind-deploy` (PR and merge queue) when this run also pushed that app's image; without
# one (a config-only change builds nothing) config-lint's helm lint / template / kubeconform per instance
# is the PR check, and main.yml's kind-deploy runs before deploy-dev.
deploy-test:
  - "**/helm/**"
  - "config/**"
  - "test-infra/kind/**"
  - "scripts/helm-*.sh"
  - ".github/actions/setup-kube-tools/**"
  - ".github/actions/kind-cluster/**"
  - ".github/actions/helm-deploy-instance/**"
  - ".github/workflows/_kind-deploy.yml"
