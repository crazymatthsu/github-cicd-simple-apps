# Config lint (ADR-0014): naming, required files, identity, allowed env layer variables,
# compose rendering, merged-config validation, parity and tag policy — all in `./gradlew configLint`
# (buildlogic.config-lint), so a laptop runs the same check. Called by pr.yml and main.yml, and runs
# on its own for pull requests that touch the config tree (config lives in this repo, ADR-0004).
# Provisional Helm (ADR-0019): the same task runs `helm lint` / `helm template` per instance (check 12) and keeps the
# rendered releases as an artefact; kubeconform validates them against the Kubernetes 1.37 schemas.
name: config-lint

on:
  workflow_call:
  pull_request:
    paths:
      - 'config/**'
      - '**/helm/**'
      - 'docker/docker-compose.yml'
      - '**/docker/docker-compose.override.yml'

permissions:
  contents: read

# CI runs on Docker (ADR-0045 rule 3): the runner carries Podman too, which the tools would otherwise prefer.
env:
  CONTAINER_ENGINE: docker

jobs:
  config-lint:
    name: config-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build's git-version plugin reads tags and history

      - uses: ./.github/actions/setup-build-env
        with:
          java: 'true'

      # Check 12 (ADR-0019): helm lint / helm template per instance and kubeconform on the rendered
      # releases, with the tools pinned in test-infra/kind/versions.env. CI=true makes a missing Helm 4 an
      # error; kubeconform is optional for the task (a warning when absent), which is why this step installs it.
      - name: Kubernetes tools (helm, kubeconform)
        uses: ./.github/actions/setup-kube-tools
        with:
          tools: helm,kubeconform

      - name: ./gradlew configLint
        run: ./gradlew configLint --continue

      - name: Report in the job summary
        if: always()
        run: |
          report=build/reports/config-lint/config-lint.txt
          [[ -f $report ]] || exit 0
          { echo "### config-lint"; echo ""; echo '```'; head -n 200 "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the config-lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/config-lint/**
          if-no-files-found: ignore
          retention-days: 7
