# Main pipeline (ADR-0023, ADR-0034).
#
#   build (all, images pushed with the pre-release tags) ─┬─ integration-test (component, every app that has them)
#                                                         └─ config-lint
#   integration-test → system-test (the reference app with the platform's Deephaven server image, ADR-0023)
#   → publish (verify + `main` tag) → kind-deploy (ADR-0019: per dev env, one Helm release per instance of the
#     reference app in a throwaway kind cluster, readiness, helm test, smoke diff) → deploy-dev (per dev env, its
#     Environment, main only: compose pools + Helm into kind-ci) → GitHub Deployment record
# A test stage runs only when the repository has what it needs (ADR-0034): integration-test when a project has
# integration tests, system-test when test-infra/compose/versions.env declares DEEPHAVEN_SERVER_IMAGE. publish
# follows the stages that ran and passed, and never a failed or cancelled one.
# The dev envs and the reference app are the project values of platform.yml (ADR-0030), read by the platform job,
# which also reads the system image from versions.env.
#
# No workflow writes to main (ADR-0020, ADR-0027): the dev tree declares `main`, the Deployment record names the literal
# version, and no job here holds `contents: write` — so no loop guard is needed.
# hotfix/* branches run the same pipeline without deploy-dev (ADR-0023).
name: main

on:
  push:
    branches: [main, 'hotfix/**']

concurrency:
  # Runs queue per branch and are never cancelled (a cancelled deploy-dev is worse than a late one).
  group: main-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# Behind the company's JFrog, the repository variable YQ_DOWNLOAD_BASE names the generic remote of the GitHub releases
# that setup-yq fetches yq from (ADR-0021); a composite action cannot read `vars`, so the workflow hands it on. Unset:
# github.com.
env:
  YQ_DOWNLOAD_BASE: ${{ vars.YQ_DOWNLOAD_BASE }}

jobs:
  platform:
    name: platform.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dev-envs: ${{ steps.platform.outputs.dev-envs }}
      reference-app: ${{ steps.platform.outputs.reference-app }}
      reference-project: ${{ steps.platform.outputs.reference-project }}
      system-image: ${{ steps.system.outputs.system-image }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            scripts/ci
            test-infra/compose

      - id: platform
        uses: ./.github/actions/platform-manifest

      # The switch of the system test (ADR-0034): DEEPHAVEN_SERVER_IMAGE, read as _integration-test.yml reads it.
      # No file, no line or an empty value: an empty output, and no system test.
      - id: system
        name: System image (versions.env)
        run: |
          versions=test-infra/compose/versions.env
          image=$(if [[ -f $versions ]]; then sed -n 's/^DEEPHAVEN_SERVER_IMAGE=//p' "$versions" | tail -n 1; fi)
          echo "system-image=$image" >> "$GITHUB_OUTPUT"

  build:
    uses: ./.github/workflows/_gradle-build.yml
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    permissions:
      contents: read
      packages: write
    with:
      projects: all
      build-images: true
      push-images: true
      ignore-head-tags: true

  config-lint:
    uses: ./.github/workflows/config-lint.yml
    permissions:
      contents: read

  integration-test:
    # Only when a project has integration tests (ADR-0034): an empty matrix fails the run.
    needs: build
    if: needs.build.outputs.it-projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.build.outputs.it-projects) }}
    uses: ./.github/workflows/_integration-test.yml
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    permissions:
      contents: read
      packages: read
    with:
      project: ${{ matrix.project }}
      images: ${{ needs.build.outputs.images }}
      level: component
      ci-build-image: ${{ needs.build.outputs.ci-build-image }}
      retention-days: 14

  system-test:
    # Only when versions.env declares the system image (ADR-0034) and platform.yml a reference app (ADR-0035). The if
    # names no status function, so the implicit success() over the needs still applies: a failed or skipped
    # integration-test skips this job too. That is intended (the system test runs the reference app's integration
    # tests); do not add always() or !failure().
    needs: [platform, build, integration-test]
    if: needs.platform.outputs.system-image != '' && needs.platform.outputs.reference-app != ''
    uses: ./.github/workflows/_integration-test.yml
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    permissions:
      contents: read
      packages: read
    with:
      # The reference scenario (ADR-0023): the reference app of platform.yml against this run's images and the
      # platform's Deephaven server image (DEEPHAVEN_SERVER_IMAGE in test-infra/compose/versions.env, ADR-0025).
      project: ${{ needs.platform.outputs.reference-project }}
      images: ${{ needs.build.outputs.images }}
      level: system
      ci-build-image: ${{ needs.build.outputs.ci-build-image }}
      retention-days: 14

  publish:
    # Never after a failed or cancelled stage (ADR-0034). It runs in three cases:
    #   - the integration tests ran and passed, and the system test ran and passed;
    #   - the integration tests ran and passed, and no system image is declared, so no system test;
    #   - no project has integration tests, so neither test stage ran.
    # A skipped test stage is accepted only with platform and build passed: then those are the only reasons left for
    # the skip. platform and integration-test are needs for that check: a failure of either skips system-test, which
    # alone would look like the second case.
    needs: [platform, build, integration-test, system-test, config-lint]
    if: >-
      ${{ !cancelled() && needs.platform.result == 'success' && needs.build.result == 'success'
      && needs.config-lint.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.integration-test.result)
      && contains(fromJSON('["success","skipped"]'), needs.system-test.result) }}
    uses: ./.github/workflows/_docker-publish.yml
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    permissions:
      contents: read
      packages: write
    with:
      # The build job pushed the ADR-0010 set (<next>-rc.<n>, sha-<sha7>, main) so the IT jobs on other
      # runners can pull the digests. After the system test, publish re-asserts every tag on exactly
      # the tested digests (a tag pointing elsewhere is moved if convenience, refused if immutable);
      # deploy-dev and release.yml consume nothing before this gate has passed.
      images: ${{ needs.build.outputs.images }}
      tags: ${{ needs.build.outputs.image-tags }}

  kind-deploy:
    # Proves the chart and each dev env's config tree with exactly the published digests before deploy-dev
    # (ADR-0019); the cluster is deleted and leak-checked in always() steps (ADR-0024).
    # The if requires what the needs require (publish passed, so platform and build did), without the implicit
    # success(): GitHub applies a skip to every later job of the chain unless its if says otherwise, and a test stage
    # skipped by design (ADR-0034) must not skip the deploys. Skipped without a dev env or a reference app (ADR-0035).
    needs: [platform, build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.platform.outputs.dev-envs != '[]' && needs.platform.outputs.reference-app != '' }}
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.platform.outputs.dev-envs) }}
    uses: ./.github/workflows/_kind-deploy.yml
    secrets:
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    permissions:
      contents: read
      packages: read
    with:
      env: ${{ matrix.env }}
      app: ${{ needs.platform.outputs.reference-app }}
      images: ${{ needs.build.outputs.images }}
      tag: ${{ needs.build.outputs.version }}
      retention-days: 14

  deploy-dev:
    # Every dev env of platform.yml (ADR-0004, ADR-0027), each in its own Environment. The if names kind-deploy for
    # the reason given there (ADR-0034); kind-deploy passed means publish, platform and build did. Without a
    # reference app no kind deploy runs, so publish is named instead; without a dev env the job is skipped (ADR-0035).
    needs: [platform, build, publish, kind-deploy]
    if: ${{ !cancelled() && !failure() && (needs.kind-deploy.result == 'success' || needs.platform.outputs.reference-app == '') && github.ref == 'refs/heads/main' && needs.publish.result == 'success' && needs.platform.outputs.dev-envs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.platform.outputs.dev-envs) }}
    uses: ./.github/workflows/_deploy-dev.yml
    permissions:
      contents: read # no workflow writes to main (ADR-0020)
      deployments: write # the GitHub Deployment record
      packages: read # the Helm adapter pulls this run's images into its kind cluster
    with:
      env: ${{ matrix.env }}
      tag: ${{ needs.build.outputs.version }}
      images: ${{ needs.build.outputs.images }}
    # inherit, not a list: DEV_DEPLOY_SSH_KEY is an Environment secret, and an Environment secret resolves only in
    # the called job that names the Environment. The registry secrets of ADR-0032 ride along.
    secrets: inherit
