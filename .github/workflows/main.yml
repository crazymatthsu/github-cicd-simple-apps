# Main pipeline (ADR-0023).
#
#   build (all, images pushed with the pre-release tags) ─┬─ integration-test (all, component)
#                                                         └─ config-lint
#   integration-test → system-test (the platform's Deephaven server image, ADR-0023) → publish (verify + `main` tag)
#   → kind-deploy (ADR-0019: one Helm release per us-dev instance of source-database in a throwaway
#     kind cluster, readiness, helm test, smoke diff) → deploy-dev (Environment us-dev, main only: compose
#     pools + Helm into kind-ci) → GitHub Deployment record
#
# No workflow writes to main (ADR-0020, ADR-0027): the dev tree declares `main`, the Deployment record names the literal
# version, and no job here holds `contents: write` — so no loop guard is needed.
# hotfix/* branches run the same pipeline without deploy-dev (ADR-0023).
name: main

on:
  push:
    branches: [main, 'hotfix/**']

concurrency:
  # Runs queue per branch and are never cancelled (a cancelled deploy-dev is worse than a late one).
  group: main-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_gradle-build.yml
    permissions:
      contents: read
      packages: write
    with:
      projects: all
      build-images: true
      push-images: true
      ignore-head-tags: true

  config-lint:
    uses: ./.github/workflows/config-lint.yml
    permissions:
      contents: read

  integration-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.build.outputs.it-projects) }}
    uses: ./.github/workflows/_integration-test.yml
    permissions:
      contents: read
      packages: read
    with:
      project: ${{ matrix.project }}
      images: ${{ needs.build.outputs.images }}
      level: component
      ci-build-image: ${{ needs.build.outputs.ci-build-image }}
      retention-days: 14

  system-test:
    needs: [build, integration-test]
    uses: ./.github/workflows/_integration-test.yml
    permissions:
      contents: read
      packages: read
    with:
      # The reference scenario (ADR-0023) against this run's images and the platform's Deephaven server image
      # (DEEPHAVEN_SERVER_IMAGE in test-infra/compose/versions.env, ADR-0025).
      project: ':source-database'
      images: ${{ needs.build.outputs.images }}
      level: system
      ci-build-image: ${{ needs.build.outputs.ci-build-image }}
      retention-days: 14

  publish:
    needs: [build, system-test, config-lint]
    uses: ./.github/workflows/_docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      # The build job pushed the ADR-0010 set (<next>-rc.<n>, sha-<sha7>, main) so the IT jobs on other
      # runners can pull the digests. After the system test, publish re-asserts every tag on exactly
      # the tested digests (a tag pointing elsewhere is moved if convenience, refused if immutable);
      # deploy-dev and release.yml consume nothing before this gate has passed.
      images: ${{ needs.build.outputs.images }}
      tags: ${{ needs.build.outputs.image-tags }}

  kind-deploy:
    # Proves the chart and the us-dev config tree with exactly the published digests before deploy-dev
    # (ADR-0019); the cluster is deleted and leak-checked in always() steps (ADR-0024).
    needs: [build, publish]
    uses: ./.github/workflows/_kind-deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      env: us-dev
      app: source-database
      images: ${{ needs.build.outputs.images }}
      tag: ${{ needs.build.outputs.version }}
      retention-days: 14

  deploy-dev:
    needs: [build, publish, kind-deploy]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_deploy-dev.yml
    permissions:
      contents: read # no workflow writes to main (ADR-0020)
      deployments: write # the GitHub Deployment record
      packages: read # the Helm adapter pulls this run's images into its kind cluster
    with:
      env: us-dev
      tag: ${{ needs.build.outputs.version }}
      images: ${{ needs.build.outputs.images }}
    secrets: inherit
