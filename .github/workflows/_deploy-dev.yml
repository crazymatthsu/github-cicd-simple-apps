# Reusable: deploy the images main.yml just published to the dev targets (D9 §6.4–§6.6, DL-32, DL-35, DL-39,
# DL-40, DL-41, DL-46).
#
# Reads one inventory per flow, config/<env>/<flow>/workflows-config.yml (D5 §6.6): env and flow restate the path,
# targets[].instance is <AppName>/<AppInstance> (the job prefixes the flow: <flow>/<AppName>/<AppInstance>),
# kind is compose | helm, cluster and namespace belong to helm targets, `pool` lists the flow's bare-metal
# boxes. Each field comes from the target, else from defaults (kind else compose, namespace else the flow, DL-38).
#   compose (demo step 1)  a flow with a `pool` (DL-39, DL-41, DL-46): scripts/pool-deploy.sh builds the flow's host
#                          bundle, syncs it as a new version directory /apps/<user>/versions/<project>/<version>/
#                          to every box of the pool, records the tag in it (record-tag on every box), runs
#                          pull → start → health from it on each instance's box (pinned → discovered → assigned)
#                          and, once every instance passed, `activate` on every box (current → the version);
#                          any failure sends every started instance back to current and current never moves —
#                          transport ssh once the Environment us-dev holds DEV_DEPLOY_SSH_KEY, else local (the
#                          runner plays every box: validate, record-tag --dry-run, start --dry-run per placement,
#                          activate --dry-run per box, the ssh commands printed). A flow without a pool keeps the
#                          PLACEHOLDER (brief v1.1): `run-compose.sh ... start --dry-run` per target on the
#                          runner and the SSH command it would run on its `host` — see TODO(DL-35) below.
#   helm    (demo step 2)  cluster kind-ci: a kind cluster created in this job (deploy-<run_id>-<attempt>;
#                          kind stands in until a dev cluster exists, DL-32) gets this run's images by
#                          digest, loaded as <repo>:<tag>; every target is deployed with
#                          scripts/helm-deploy-instance.sh (namespace, Secret, helm lint, upgrade --install
#                          --rollback-on-failure --wait, rollout status, helm test); the cluster is deleted
#                          and leak-checked in always() steps (DL-27). Any other cluster fails its targets —
#                          TODO(Phase 3) below.
# No workflow writes to `main` (DL-40): the dev tree declares its intent (`IMAGE_TAG=main`, `image.tag: main`)
# and the run is recorded as a GitHub Deployment of the env's Environment (<env>, D12 §6.7), one per run, whose
# payload names per instance the tag, the digest-pinned image, the box or cluster and the result, plus the
# config tree's git SHA (the run's commit) and, per pooled flow, the version directory; the job summary is the
# human-readable copy and the version directories' _docker-compose.instance.env (record-tag) the second one. qa and prod are never
# touched: the job refuses any env that is not
# *-dev, and so do run-compose.sh and helm-deploy-instance.sh.
name: _deploy-dev

on:
  workflow_call:
    inputs:
      env:
        description: Config env to deploy (a *-dev env).
        type: string
        default: us-dev
      tag:
        description: Image tag to deploy (the connector-family pre-release tag published by main.yml).
        type: string
        required: true
      images:
        description: JSON object Gradle project → digest-pinned image; recorded in the deployment payload and loaded into kind for helm targets.
        type: string
        default: '{}'
    outputs:
      deployed:
        description: JSON list of the instances deployed (<flow>/<AppName>/<AppInstance>).
        value: ${{ jobs.deploy.outputs.deployed }}
      placements:
        description: The boxes of the pooled compose instances, "<flow>/<AppName>/<AppInstance>=<host> ..." (DL-39).
        value: ${{ jobs.deploy.outputs.placements }}

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.env }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The env's GitHub Environment (us-dev; D12 §6.7, DL-40): no reviewers, deployment branch `main` (D9 §6.2).
    # `deployment: false` keeps the Environment's rules and secrets without an automatic deployment object, so
    # the record created at the end (with its payload) is the only one per run.
    environment:
      name: ${{ inputs.env }}
      deployment: false
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read # never write: no workflow commits to main (DL-40)
      deployments: write # the GitHub Deployment record
      packages: read # helm targets: this run's images are pulled into the kind cluster
    env:
      DEPLOY_ENV: ${{ inputs.env }}
      DEPLOY_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The kind cluster of the helm targets (cluster kind-ci). Named here, not by `up`, so teardown and
      # leak check find it even when `up` never finished (DL-27).
      KIND_CLUSTER_NAME: deploy-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      deployed: ${{ steps.deployed.outputs.json }}
      placements: ${{ steps.compose.outputs.placements }}
    steps:
      - uses: actions/checkout@v7

      - name: Guard
        run: |
          set -euo pipefail
          if [[ ! $DEPLOY_ENV =~ ^[a-z][a-z0-9]*-dev$ ]]; then
            echo "::error::deploy-dev only deploys *-dev envs, got '$DEPLOY_ENV' (qa / prod go through bump PRs)"
            exit 1
          fi
          [[ $DEPLOY_TAG =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::invalid tag '$DEPLOY_TAG'"; exit 1; }

      - name: Resolve the targets
        id: targets
        run: |
          set -euo pipefail
          # One inventory per flow (D5 §6.6): merge config/<env>/<flow>/workflows-config.yml into one list with the
          # flow prepended to every instance, so everything below sees <flow>/<AppName>/<AppInstance>.
          for legacy in config/"$DEPLOY_ENV"/targets.yml config/"$DEPLOY_ENV"/workflows-config.yml config/"$DEPLOY_ENV"/*/targets.yml; do
            [[ -f $legacy ]] || continue
            echo "::error::$legacy: the deploy inventory is config/$DEPLOY_ENV/<flow>/workflows-config.yml (one per flow, DL-39)"
            exit 1
          done
          files=()
          for file in config/"$DEPLOY_ENV"/*/workflows-config.yml; do
            if [[ -f $file ]]; then files+=("$file"); fi
          done
          echo '[]' > "$RUNNER_TEMP/targets.raw.json"
          echo '{}' > "$RUNNER_TEMP/pools.json"
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::warning::no config/$DEPLOY_ENV/<flow>/workflows-config.yml found — nothing to deploy"
          fi
          for file in "${files[@]}"; do
            flow=$(basename "$(dirname "$file")")
            declared=$(yq '(.env // "") + "/" + (.flow // "")' "$file")
            if [[ $declared != "$DEPLOY_ENV/$flow" ]]; then
              echo "::error::$file declares env/flow '$declared', expected '$DEPLOY_ENV/$flow'"
              exit 1
            fi
            # shellcheck disable=SC2016 # $d is a yq variable, not a shell one
            FLOW=$flow yq -o=json -I=0 '(.defaults // {}) as $d | [(.targets // [])[] | {
                "instance": (strenv(FLOW) + "/" + (.instance // "")),
                "kind": (.kind // $d.kind // "compose"),
                "host": (.host // $d.host // ""),
                "user": (.user // $d.user // "deploy"),
                "cluster": (.cluster // $d.cluster // ""),
                "namespace": (.namespace // $d.namespace // "{flow}")
              }]' "$file" > "$RUNNER_TEMP/flow.json"
            jq -s 'add' "$RUNNER_TEMP/targets.raw.json" "$RUNNER_TEMP/flow.json" > "$RUNNER_TEMP/merged.json"
            mv "$RUNNER_TEMP/merged.json" "$RUNNER_TEMP/targets.raw.json"
            if [[ $(yq '.pool | tag' "$file") == '!!map' ]]; then
              yq -o=json -I=0 '.pool' "$file" > "$RUNNER_TEMP/pool.json"
              jq --arg flow "$flow" --slurpfile pool "$RUNNER_TEMP/pool.json" '. + {($flow): $pool[0]}' \
                "$RUNNER_TEMP/pools.json" > "$RUNNER_TEMP/merged.json"
              mv "$RUNNER_TEMP/merged.json" "$RUNNER_TEMP/pools.json"
            fi
          done
          jq -e 'all(.[]; (.instance | type == "string" and test("^[a-z0-9-]+/[a-z0-9-]+/[a-z0-9-]+$")) and (.kind == "compose" or .kind == "helm"))' \
            "$RUNNER_TEMP/targets.raw.json" >/dev/null ||
            { echo "::error::every target needs instance <AppName>/<AppInstance> and kind compose | helm (config/$DEPLOY_ENV/<flow>/workflows-config.yml)"; exit 1; }
          # compose targets keep host and user; helm targets keep cluster and namespace, "{flow}" → the flow.
          jq -c 'map((.instance | split("/")[0]) as $flow
              | if .kind == "helm" then del(.host, .user) | .namespace |= gsub("\\{flow\\}"; $flow)
                else del(.cluster, .namespace) end)' "$RUNNER_TEMP/targets.raw.json" > "$RUNNER_TEMP/targets.json"
          jq -e 'all(.[] | select(.kind == "helm");
              (.cluster | type == "string" and test("^[a-z0-9][a-z0-9.-]*$"))
              and (.namespace | type == "string" and test("^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$")))' \
            "$RUNNER_TEMP/targets.json" >/dev/null ||
            { echo "::error::every helm target needs a cluster and a namespace that is a DNS label once {flow} is substituted"; exit 1; }
          {
            echo "compose=$(jq '[.[] | select(.kind == "compose")] | length' "$RUNNER_TEMP/targets.json")"
            echo "helm=$(jq '[.[] | select(.kind == "helm")] | length' "$RUNNER_TEMP/targets.json")"
            # Flows whose compose targets go through scripts/pool-deploy.sh: a pool and at least one compose target.
            echo "pooled=$(jq -r --slurpfile pools "$RUNNER_TEMP/pools.json" '[.[] | select(.kind == "compose")
                | .instance | split("/")[0]] | unique | map(select(. as $f | $pools[0] | has($f))) | join(" ")' \
                "$RUNNER_TEMP/targets.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy compose targets (demo step 1 — host pools, DL-39 / DL-41)
        id: compose
        env:
          DEV_DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          POOLED_FLOWS: ${{ steps.targets.outputs.pooled }}
        run: |
          set -euo pipefail
          # A flow whose workflows-config.yml declares a `pool` (DL-39): scripts/pool-deploy.sh builds the flow's host
          # bundle from this checkout (validated from inside with IMAGE_TAG=<tag>), syncs it as a NEW version
          # directory /apps/<user>/versions/<project>/<YYYYMMDD-HHMMSS>/ to every box of the pool (DL-41, DL-46),
          # records the tag in it on every box (IMAGE_TAG=<tag> run-compose.sh ... record-tag: the directory's
          # _docker-compose.instance.env names what it runs; the tree's says `main`, DL-40), resolves each instance's box
          # (pinned → discovered → assigned) and runs, there, from the new directory,
          #   run-compose.sh <env> <flow> <app> <inst> pull → start → health
          # then, once every instance passed, `run-compose.sh activate` on every box: current → the new version
          # (an atomic symlink switch; versions beyond `keep` removed). Any failed start or health sends every
          # instance already started back to current — the previous version directory, old image and old config —
          # and current never moves (D9 §6.9); a rollback later is `pool-deploy.sh <env> <flow> rollback`. The
          # GitHub Deployment below records the version, and git stays untouched.
          #   ssh    when the Environment `us-dev` holds DEV_DEPLOY_SSH_KEY: the key lives in this step's ssh-agent
          #          only, and the reviewed config/<env>/known_hosts pins the boxes' host keys (pool-deploy.sh
          #          refuses without it; an unknown key is never accepted).
          #   local  otherwise — no box exists yet (brief v1.1): the runner plays every box, one directory each
          #          under $RUNNER_TEMP/boxes (so every box provably gets the same complete tree), validate,
          #          record-tag --dry-run and start --dry-run per placement, activate --dry-run per box, and the
          #          ssh commands printed.
          # A flow without a pool keeps the per-target placeholder further down.
          # TODO(DL-35), on the boxes: the deploy key's authorized_keys entry has a forced command
          #   (command="/usr/local/bin/run-compose-ssh",no-pty,no-port-forwarding,no-agent-forwarding) that accepts
          #   only `[IMAGE_TAG=<tag>] /apps/<user>/versions/<project>/<version|current>/scripts/run-compose.sh
          #   <env> <flow> <AppName> <AppInstance> pull|start|stop|health|record-tag|status [--json]`, the same
          #   script with `activate [--keep N] [--previous | --to <version>]`, and the bundle sync (rsync --server
          #   into /apps/<user>/versions/<project>/<version>/, e.g. through rrsync), validates the arguments and
          #   execs them; the boxes are provisioned with /apps/<user>/versions/<project>/ and
          #   /apps/<user>/shared/<project>/. A box that GitHub-hosted runners cannot reach gets a self-hosted
          #   runner on it (runs-on: [self-hosted, <host>]) running the same commands locally — the one
          #   self-hosted exception (DL-35, D7 §2).
          deployed=() failed=() placements=() pool_failed=()
          read -r -a pooled <<<"$POOLED_FLOWS"
          if [[ ${#pooled[@]} -gt 0 ]]; then
            if [[ -n ${DEV_DEPLOY_SSH_KEY:-} ]]; then
              export POOL_TRANSPORT=ssh
              key="$RUNNER_TEMP/deploy-key"
              (umask 077 && printf '%s\n' "$DEV_DEPLOY_SSH_KEY" > "$key")
              eval "$(ssh-agent -s)" > /dev/null
              trap 'ssh-agent -k > /dev/null 2>&1 || true' EXIT
              ssh-add -q "$key"
              rm -f "$key"
            else
              export POOL_TRANSPORT=local POOL_LOCAL_ROOT="$RUNNER_TEMP/boxes"
            fi
            for flow in "${pooled[@]}"; do
              bundle="$RUNNER_TEMP/bundle-$flow" report="$RUNNER_TEMP/pool-$flow.json" out="$RUNNER_TEMP/deployed-$flow.txt"
              rc=0
              : > "$out"
              echo "::group::pool $DEPLOY_ENV/$flow: host bundle"
              scripts/pool-deploy.sh "$DEPLOY_ENV" "$flow" bundle --out "$bundle" --tag "$DEPLOY_TAG" || rc=$?
              echo "::endgroup::"
              if [[ $rc -eq 0 ]]; then
                echo "::group::pool $DEPLOY_ENV/$flow: deploy (transport $POOL_TRANSPORT)"
                scripts/pool-deploy.sh "$DEPLOY_ENV" "$flow" deploy --tag "$DEPLOY_TAG" --bundle "$bundle" \
                  --report "$report" > "$out" || rc=$?
                echo "::endgroup::"
              fi
              # stdout: `deployed <flow>/<app>/<inst>@<host>=<tag>` per instance that deployed (validated, with local).
              while IFS= read -r line; do
                if [[ $line =~ ^deployed\ ([a-z0-9-]+/[a-z0-9-]+/[a-z0-9-]+)@([a-z0-9.-]+)=(.+)$ ]]; then
                  deployed+=("${BASH_REMATCH[1]}")
                  placements+=("${BASH_REMATCH[1]}=${BASH_REMATCH[2]}")
                fi
              done < "$out"
              expected=$(jq -r --arg f "$flow" '.[] | select(.kind == "compose") | .instance | select(startswith($f + "/"))' \
                "$RUNNER_TEMP/targets.json")
              for instance in $expected; do
                [[ " ${deployed[*]} " == *" $instance "* ]] || failed+=("$instance")
              done
              if [[ $rc -ne 0 ]]; then
                echo "::error::pool-deploy.sh $DEPLOY_ENV $flow failed (exit $rc) — see the group above"
                pool_failed+=("$flow")
              fi
              {
                echo "### deploy-dev: pool \`$DEPLOY_ENV/$flow\` (transport \`$POOL_TRANSPORT\`, DL-39 / DL-41)"
                echo ""
                if [[ -f $report ]]; then
                  jq -r '"Version `\(.version // "—")` of `\(.project)` under `\(.pool.root)` on every box; `current` points at it once every instance passed health (DL-41, DL-46)."' "$report"
                  echo ""
                  echo "| box | bundle | files | sha256 | verified | activated |"
                  echo "|---|---|---|---|---|---|"
                  jq -r '.boxes[] | "| `\(.host)` | \(.result) | \(.files // "—") | `\(.sha256 // "—")` | \(.verified // "—") | \(.activated // "—") |"' "$report"
                  echo ""
                  echo "| instance | host | how | result | command |"
                  echo "|---|---|---|---|---|"
                  jq -r '.placements[] | "| `\(.instance)` | \(.host // "—") | \(.how) | \(.result // "—") | \((.commands // []) | map("`" + . + "`") | join("<br>")) |"' "$report"
                else
                  echo "- **failed** before any box was touched (exit $rc): see the job log"
                fi
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          # A flow without a pool: the per-target placeholder (brief v1.1, TODO(DL-35)) — `run-compose.sh ... start
          # --dry-run` on the runner and the SSH command it would run on the target's `host`. It validates the config
          # as the host runs it: a candidate copy of the tree with IMAGE_TAG set to the deployed tag (CONFIG_ROOT),
          # which is what the override IMAGE_TAG=<tag> and record-tag produce on a real host.
          rows=$(jq -r --arg pooled " $POOLED_FLOWS " '.[] | select(.kind == "compose")
              | (.instance | split("/")[0]) as $flow | select($pooled | contains(" " + $flow + " ") | not)
              | [.instance, .host, .user] | join("|")' "$RUNNER_TEMP/targets.json")
          legacy=()
          [[ -z $rows ]] || mapfile -t legacy <<<"$rows"
          if [[ ${#legacy[@]} -gt 0 ]]; then
            candidate="$RUNNER_TEMP/config-candidate"
            rm -rf "$candidate"
            if [[ -d config ]]; then cp -a config "$candidate"; fi
            {
              echo "### deploy-dev: compose targets without a pool (placeholder — TODO(DL-35))"
              echo ""
              echo "| instance | host | result | command it would run |"
              echo "|---|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"
            for row in "${legacy[@]}"; do
              # "|", not a tab: read would merge the tabs around an empty host.
              IFS='|' read -r instance host user <<<"$row"
              IFS=/ read -r flow app inst <<<"$instance"
              wrapper="scripts/run-compose.sh"   # the one implementation for every app (D12 §6.2)
              remote_cmd="IMAGE_TAG=$DEPLOY_TAG run-compose.sh $DEPLOY_ENV $flow $app $inst"
              ssh_cmd="ssh ${user}@${host:-<host missing in workflows-config.yml>} '$remote_cmd pull && $remote_cmd start && $remote_cmd health'"
              echo "::group::$instance"
              result=validated
              if [[ -z $host ]]; then
                echo "::error::$instance: no host in config/$DEPLOY_ENV/$flow/workflows-config.yml and no pool"
                result="failed: no host"
              elif [[ ! -f $wrapper ]]; then
                echo "::error::$instance: $wrapper not found"
                result="failed: no run-compose.sh"
              elif ! scripts/ci/set-image-tag.sh "$DEPLOY_TAG" "$candidate/$DEPLOY_ENV/$instance/_docker-compose.instance.env" >/dev/null; then
                echo "::error::$instance: config/$DEPLOY_ENV/$instance/_docker-compose.instance.env missing"
                result="failed: no _docker-compose.instance.env"
              # Validate as the host would run it: GITHUB_RUN_ID would switch run-compose.sh to the CI
              # project name (ci-<run>-<attempt>-...), which the dev host never uses.
              elif ! env -u GITHUB_RUN_ID -u GITHUB_RUN_ATTEMPT CONFIG_ROOT="$candidate" \
                  bash "$wrapper" "$DEPLOY_ENV" "$flow" "$app" "$inst" start --dry-run; then
                echo "::error::$instance: run-compose.sh start --dry-run failed"
                result="failed: dry-run"
              fi
              if [[ $result == validated ]]; then
                echo "would run: $ssh_cmd"
                deployed+=("$instance")
              else
                failed+=("$instance")
              fi
              echo "::endgroup::"
              echo "| \`$instance\` | ${host:-—} | $result | \`$ssh_cmd\` |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          {
            echo "deployed=$(printf '%s\n' "${deployed[@]}" | jq -R . | jq -cs 'map(select(length > 0))')"
            echo "list=${deployed[*]}"
            echo "placements=${placements[*]}"
          } >> "$GITHUB_OUTPUT"
          if [[ ${#failed[@]} -gt 0 || ${#pool_failed[@]} -gt 0 ]]; then
            echo "::error::compose: ${#failed[@]} target(s) failed${failed[*]:+: ${failed[*]}} — recorded as failed in the Deployment${pool_failed[*]:+; pool-deploy.sh failed for: ${pool_failed[*]}}"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan the helm targets (demo step 2)
        id: helm-plan
        if: steps.targets.outputs.helm != '0'
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          # TODO(Phase 3): a helm target whose cluster is not kind-ci needs that cluster's kubeconfig from
          #   the Environment `us-dev` secrets — DEV_KUBECONFIG_<CLUSTER> for a persistent dev cluster, or
          #   GitHub OIDC → IAM role → EKS RBAC once dev runs on EKS (D9 §6.7, DL-32) — written to
          #   $RUNNER_TEMP with mode 600 and passed to helm-deploy-instance as `kubeconfig`, with no kind
          #   cluster and no image load (that cluster pulls from the registry). Until then such a target
          #   fails here and is recorded as failed.
          targets='[]' refs=() failed=()
          { echo "### deploy-dev: helm targets"; echo ""; } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r instance cluster namespace; do
            IFS=/ read -r _ app _ <<<"$instance"
            if [[ $cluster != kind-ci ]]; then
              echo "::error::$instance: cluster '$cluster' — TODO(Phase 3): kubeconfig for $cluster from the Environment us-dev secrets"
              echo "- \`$instance\`: **failed**, cluster \`$cluster\` has no kubeconfig yet (TODO(Phase 3); the demo deploys \`kind-ci\` only)" >> "$GITHUB_STEP_SUMMARY"
              failed+=("$instance")
              continue
            fi
            # The images key whose last segment is the AppName (:<AppName>; :<parent>:<AppName> in a nesting monorepo).
            ref=$(jq -r --arg a "$app" '[to_entries[] | select((.key | split(":") | last) == $a) | .value][0] // empty' <<<"$IMAGES")
            if [[ ! $ref =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$instance: no digest-pinned image of $app in the images input"
              echo "- \`$instance\`: **failed**, no image of \`$app\` from this run" >> "$GITHUB_STEP_SUMMARY"
              failed+=("$instance")
              continue
            fi
            targets=$(jq -c --arg i "$instance" --arg ns "$namespace" '. + [{instance: $i, namespace: $ns}]' <<<"$targets")
            if [[ " ${refs[*]} " != *" $ref "* ]]; then refs+=("$ref"); fi
          done < <(jq -r '.[] | select(.kind == "helm") | [.instance, .cluster, .namespace] | @tsv' "$RUNNER_TEMP/targets.json")
          count=$(jq 'length' <<<"$targets")
          kind=false
          if [[ $count -gt 0 ]]; then
            kind=true
            echo "- $count target(s) of cluster \`kind-ci\` into the kind cluster \`$KIND_CLUSTER_NAME\`, tag \`$DEPLOY_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "kind=$kind"
            echo "targets=$targets"
            echo "images=${refs[*]}"
            echo "failed=${failed[*]}"
          } >> "$GITHUB_OUTPUT"

      - name: Kubernetes tools (test-infra/kind/versions.env)
        if: steps.helm-plan.outputs.kind == 'true'
        uses: ./.github/actions/setup-kube-tools
        with:
          tools: kind,kubectl,helm

      - name: Registry login (this run's images)
        if: steps.helm-plan.outputs.kind == 'true'
        uses: ./.github/actions/registry-login

      - name: kind cluster up (cluster kind-ci)
        if: steps.helm-plan.outputs.kind == 'true'
        uses: ./.github/actions/kind-cluster
        with:
          command: up

      - name: Load this run's images into kind
        id: load
        if: steps.helm-plan.outputs.kind == 'true'
        uses: ./.github/actions/kind-cluster
        with:
          command: load
          images: ${{ steps.helm-plan.outputs.images }}
          tag: ${{ inputs.tag }}

      - name: Deploy helm targets (demo step 2)
        id: helm
        if: steps.helm-plan.outputs.kind == 'true'
        uses: ./.github/actions/helm-deploy-instance
        with:
          env: ${{ inputs.env }}
          targets: ${{ steps.helm-plan.outputs.targets }}
          tag: ${{ inputs.tag }}
          loaded-images: ${{ steps.load.outputs.loaded }}
          # Every target is attempted; failed ones are recorded as failed and fail the job after it.
          fail-on-error: 'false'

      - name: Diagnostics before teardown (kind)
        if: ${{ !cancelled() && steps.helm-plan.outputs.kind == 'true' && (failure() || steps.helm.outputs.failed != '') }}
        uses: ./.github/actions/kind-cluster
        with:
          command: diagnostics
          diagnostics-dir: build/kind-logs

      - name: Upload diagnostics
        if: ${{ !cancelled() && steps.helm-plan.outputs.kind == 'true' && (failure() || steps.helm.outputs.failed != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: deploy-dev-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/kind-logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Teardown the kind cluster (success, failure and cancel)
        if: always() && steps.helm-plan.outputs.kind == 'true'
        uses: ./.github/actions/kind-cluster
        with:
          command: down

      - name: Leak check (kind)
        if: always() && steps.helm-plan.outputs.kind == 'true'
        uses: ./.github/actions/kind-cluster
        with:
          command: leak-check

      - name: Collect the deployed instances
        id: deployed
        if: ${{ !cancelled() }}
        env:
          COMPOSE_DEPLOYED: ${{ steps.compose.outputs.list }}
          HELM_DEPLOYED: ${{ steps.helm.outputs.deployed }}
        run: |
          set -euo pipefail
          read -r -a instances <<<"$COMPOSE_DEPLOYED $HELM_DEPLOYED"
          echo "list=${instances[*]}" >> "$GITHUB_OUTPUT"
          echo "json=$(printf '%s\n' "${instances[@]}" | jq -R . | jq -cs 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

      - name: Record the deployment (DL-40)
        id: deployment
        # Also after a failed target or teardown step: what did and did not deploy is recorded; never after a cancel.
        if: ${{ !cancelled() }}
        env:
          IMAGES: ${{ inputs.images }}
          DEPLOYED: ${{ steps.deployed.outputs.json }}
          PLACEMENTS: ${{ steps.compose.outputs.placements }}
        run: |
          set -euo pipefail
          # The record of what dev runs (D5 §6.8, D9 §6.3): one GitHub Deployment of the env's Environment per run,
          # ref = this commit (the config tree deployed), payload = the tag, this run's digest-pinned images and
          # every target with its box or cluster and its result, plus the version directory of every pooled flow.
          # The tree's dev files say `main`; the literal tag lives here and in the version directories'
          # _docker-compose.instance.env (record-tag) — never in a commit to main.
          if [[ ! -f $RUNNER_TEMP/targets.json ]]; then
            echo "::warning::no targets were resolved, so there is no deployment to record"
            exit 0
          fi
          boxes=$(tr ' ' '\n' <<<"$PLACEMENTS" | jq -R 'select(length > 0) | split("=") | {key: .[0], value: .[1]}' | jq -cs 'from_entries')
          instances=$(jq -c --argjson deployed "${DEPLOYED:-[]}" --argjson boxes "$boxes" --argjson images "$IMAGES" '
              map(. as $t | ($t.instance | split("/")[1]) as $app
                | {instance: $t.instance, kind: $t.kind}
                + (if $t.kind == "compose" then {host: ($boxes[$t.instance] // (if ($t.host // "") == "" then null else $t.host end))}
                   else {cluster: $t.cluster, namespace: $t.namespace} end)
                + {image: ([$images | to_entries[] | select((.key | split(":") | last) == $app) | .value][0] // null),
                   result: (if ($deployed | any(. == $t.instance)) then "deployed" else "failed" end)})' \
              "$RUNNER_TEMP/targets.json")
          bundles=$(for f in "$RUNNER_TEMP"/pool-*.json; do
              if [[ -f $f ]]; then jq -c '{(.flow): {version: .version, root: .pool.root, sha256: .bundle.sha256, files: .bundle.files, transport: .transport}}' "$f"; fi
            done | jq -cs 'add // {}')
          total=$(jq 'length' <<<"$instances")
          ok=$(jq '[.[] | select(.result == "deployed")] | length' <<<"$instances")
          state=success
          [[ $ok -eq $total ]] || state=failure
          payload=$(jq -cn --arg env "$DEPLOY_ENV" --arg tag "$DEPLOY_TAG" --arg sha "$GITHUB_SHA" --arg run "$RUN_URL" \
            --argjson images "$IMAGES" --argjson instances "$instances" --argjson bundles "$bundles" \
            '{env: $env, tag: $tag, configSha: $sha, run: $run, images: $images, instances: $instances, bundles: $bundles}')
          id=$(jq -n --arg ref "$GITHUB_SHA" --arg env "$DEPLOY_ENV" --argjson payload "$payload" \
                --arg desc "deploy-dev $DEPLOY_ENV $DEPLOY_TAG: $ok/$total deployed" '{
                ref: $ref, environment: $env, task: "deploy", description: $desc,
                auto_merge: false, required_contexts: [], payload: $payload,
                transient_environment: false, production_environment: false
              }' | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state="$state" -f log_url="$RUN_URL" -f description="deploy-dev $DEPLOY_TAG: $ok/$total instance(s) deployed" >/dev/null
          {
            echo "### deploy-dev: GitHub Deployment $id of Environment \`$DEPLOY_ENV\` — **$state** (DL-40)"
            echo ""
            echo "The record of what \`$DEPLOY_ENV\` runs: tag \`$DEPLOY_TAG\`, config tree \`${GITHUB_SHA::7}\`. Nothing is committed to \`main\`."
            echo ""
            echo "| instance | kind | where | image | result |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | "| `\(.instance)` | \(.kind) | \(if .kind == "compose" then (.host // "—") else (.cluster + "/" + .namespace) end) | `\(.image // "—")` | \(.result) |"' <<<"$instances"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "id=$id"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      - name: Fail when a target failed
        if: ${{ !cancelled() && (steps.compose.outputs.failed == 'true' || steps.helm-plan.outputs.failed != '' || steps.helm.outputs.failed != '') }}
        env:
          HELM_PLAN_FAILED: ${{ steps.helm-plan.outputs.failed }}
          HELM_FAILED: ${{ steps.helm.outputs.failed }}
        run: |
          read -r -a names <<<"$HELM_PLAN_FAILED $HELM_FAILED"
          echo "::error::deploy-dev: target(s) failed (recorded as failed in the Deployment) — compose: see its table; helm: ${names[*]:-none}"
          exit 1
