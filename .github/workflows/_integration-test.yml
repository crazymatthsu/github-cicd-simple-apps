# Reusable: one integration-test job for one Gradle project (ADR-0025, ADR-0044).
#
# Start the project's compose stack (the dependency stacks it declares in test-infra/compose/stacks.yml, on the
# images pinned in test-infra/compose/versions.env, + the app image built in this run, by digest) → run the tests in
# the `it-runner` service (the ci-build image, else its public fallback, ADR-0033; on the stack network, no
# published ports) → diagnostics on failure → teardown and leak check on success, failure AND cancel (`always()`,
# ADR-0024). This workflow names no dependency (ADR-0038, ADR-0044): which images a stack runs on is the stack's
# own declaration.
name: _integration-test

on:
  workflow_call:
    secrets:
      REGISTRY_USER:
        description: "Registry user name when the registry of platform.yml is not GHCR (ADR-0032). Empty: GITHUB_TOKEN."
        required: false
      REGISTRY_TOKEN:
        description: "Its token (ADR-0032). Empty: GITHUB_TOKEN."
        required: false
    inputs:
      project:
        description: Gradle project path, e.g. :source-database.
        type: string
        required: true
      images:
        description: JSON object Gradle project → image pinned by digest (the _gradle-build `images` output).
        type: string
        required: true
      ci-build-image:
        description: "ci-build image for the it-runner service ('' → probe the registry; unpublished: the public fallback, ADR-0033)."
        type: string
        default: ''
      retention-days:
        description: Retention of the uploaded reports and diagnostics (ADR-0021 — 7 on PRs, 14 on main).
        type: number
        default: 7
    outputs:
      diagnostics-artifact:
        description: Name of the diagnostics artefact (uploaded only when the job fails).
        value: ${{ jobs.it.outputs.diagnostics-artifact }}

permissions:
  contents: read

jobs:
  it:
    name: integration tests (${{ inputs.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      # One stack per job and runner VM; every resource carries the run labels (ADR-0024).
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      # The image under test is the digest built in this run, never a floating tag.
      APP_IMAGE: ${{ fromJSON(inputs.images)[inputs.project] }}
      IT_PROJECT: ${{ inputs.project }}
    outputs:
      diagnostics-artifact: ${{ steps.check.outputs.diagnostics }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check inputs
        id: check
        run: |
          set -euo pipefail
          if [[ ! $APP_IMAGE =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest-pinned image for $IT_PROJECT in the images input (got '${APP_IMAGE}')"
            exit 2
          fi
          slug=$(sed 's/^://; s/:/-/g' <<<"$IT_PROJECT")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "diagnostics=it-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${slug}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/registry-login
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build environment (Gradle cache for it-runner, ci-build image)
        uses: ./.github/actions/setup-build-env
        with:
          java: 'false'
          # The host Gradle user home is bind-mounted into it-runner; only the build job writes the cache.
          gradle-cache-read-only: 'true'
          ensure-base: ci-build
          ci-build-image: ${{ inputs.ci-build-image }}

      - name: Start the stack (pull, up --wait)
        uses: ./.github/actions/compose-stack
        with:
          command: up
          project: ${{ inputs.project }}

      - name: Integration tests in it-runner
        run: |
          set -euo pipefail
          read -r -a compose <<<"${COMPOSE_BIN:-docker compose}"
          "${compose[@]}" run --rm it-runner ./gradlew "${IT_PROJECT}:integrationTest" -Pcompose.managed=false --no-daemon

      - name: Diagnostics before teardown
        if: failure()
        uses: ./.github/actions/compose-stack
        with:
          command: diagnostics
          diagnostics-dir: build/ci-logs

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.check.outputs.diagnostics }}
          path: |
            build/ci-logs/**
            **/build/test-results/**
            **/build/reports/**
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}

      - name: Teardown (success, failure and cancel)
        if: always()
        uses: ./.github/actions/compose-stack
        with:
          command: down

      - name: Leak check
        if: always()
        uses: ./.github/actions/compose-stack
        with:
          command: leak-check

      - name: Test summary
        if: always()
        run: scripts/ci/junit-summary.sh "Integration tests (${IT_PROJECT})"

      - name: Upload test results
        if: always() && steps.check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: it-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.check.outputs.slug }}
          path: '**/build/test-results/integrationTest/**'
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}
