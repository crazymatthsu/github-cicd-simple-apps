# hadolint configuration (ADR-0009, ADR-0021). Runs in the pr.yml `lint` job on every tracked Dockerfile:
#   hadolint --config .hadolint.yaml $(git ls-files 'Dockerfile' '**/Dockerfile' '*.Dockerfile' '**/*.Dockerfile')
# i.e. docker/spring-boot.Dockerfile, shared by every app (ADR-0009), plus any app's docker/Dockerfile override.
# Warnings fail the job; info-level findings are reported only.
failure-threshold: warning

# Registries a FROM may name. Demo: the public upstreams and GHCR; enterprise: only the JFrog remotes
# (artifactory.<company>.com), so an image that bypasses JFrog fails the lint (ADR-0009).
# FROM ${BASE_IMAGE}-style references are resolved at build time and not checked here.
trustedRegistries:
  - docker.io
  - ghcr.io
  - gcr.io
  - mcr.microsoft.com

override:
  info:
    # Pin versions in apt-get install: relaxed. The company base images install OS packages, they
    # are rebuilt weekly to pick up patches (ADR-0009), and pinned Ubuntu package versions disappear from
    # the archive. The shared app Dockerfile installs only curl, and only on a base that lacks it (the
    # public fallback, ADR-0033).
    - DL3008
