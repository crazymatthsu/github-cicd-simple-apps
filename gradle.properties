# Build performance and reproducibility (ADR-0007). No version number lives here: project.version is
# derived from git by the buildlogic.git-version settings plugin (ADR-0008).
org.gradle.caching=true
# Every plugin in this build tolerates the configuration cache (Spring Boot 4.1 plugin, kotlin-dsl and the
# buildlogic.* conventions); problems fail the build instead of degrading silently.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# The JDK comes from the ci-build image (CI) or the developer's installation; never downloaded (ADR-0007).
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.auto-detect=true
