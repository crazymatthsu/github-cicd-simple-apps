# The ONE compose template of every app, for every env / flow / instance (ADR-0012, ADR-0017): local development,
# CI test stacks and the dev compose hosts — never qa or prod. It names no app: the service is `app`, reached by the
# others as ${APP_NAME} (a network alias; compose does not interpolate mapping keys). What one app needs in every env
# goes in apps/<AppName>/docker/docker-compose.override.yml; what one env / flow / app / instance needs, in the
# config tree's _docker-compose.<layer>.yml. Two callers set its variables:
#  - scripts/run-compose.sh: identity (APP_ENV, APP_FLOW, APP_NAME, APP_INSTANCE from the config-tree path), the
#    generated combined env COMPOSE_ENV_FILE (also passed with --env-file), the Spring layer files FLOW_APP_YML,
#    APP_APP_YML, INSTANCE_APP_YML, PROJECT and the SELinux mount suffixes; with DEPS_NETWORK, an override that joins
#    that network (below).
#  - test-infra/compose/stack.sh up (APP_IMAGE set): merges this file into the dependency stack, on the stack's
#    default network, with the same variables (ADR-0025).
# Relative paths in any -f file resolve against this file's directory (docker/): overrides use variable-based paths only.
services:
  app:
    image: ${APP_IMAGE:-${IMAGE_REPO:?IMAGE_REPO is set in _docker-compose.<layer>.env}/${APP_NAME:?run through run-compose.sh}:${IMAGE_TAG:?IMAGE_TAG is set in _docker-compose.instance.env}}
    # The combined env of the instance's layers (flow < app < instance), generated by run-compose.sh.
    env_file:
      - ${COMPOSE_ENV_FILE:?run through run-compose.sh}
    environment:
      # Identity from the config-tree path (overrides the combined env, whose instance layer must restate it, ADR-0003).
      APP_ENV: ${APP_ENV:?run through run-compose.sh}
      APP_FLOW: ${APP_FLOW:?run through run-compose.sh}
      APP_NAME: ${APP_NAME:?run through run-compose.sh}
      APP_INSTANCE: ${APP_INSTANCE:?run through run-compose.sh}
      # Integration tests prefix their target tables (ADR-0025); empty everywhere else.
      IT_TABLE_PREFIX: ${IT_TABLE_PREFIX:-}
    volumes:
      # The Spring layers, one file each, read-only (ADR-0011): the jar imports /config/{flow,common,instance}/
      # application.yml. Only application.<layer>.yml is mounted, never a directory of the config tree. The
      # optional flow layer mounts /dev/null (an empty file) when it does not exist. Shared layers get :z and the
      # instance :Z on SELinux hosts (run-compose.sh sets the suffixes when getenforce reports Enforcing, ADR-0017).
      - ${FLOW_APP_YML:-/dev/null}:/config/flow/application.yml:ro${SELINUX_LABEL_SHARED:-}
      - ${APP_APP_YML:?run through run-compose.sh}:/config/common/application.yml:ro${SELINUX_LABEL_SHARED:-}
      - ${INSTANCE_APP_YML:?run through run-compose.sh}:/config/instance/application.yml:ro${SELINUX_LABEL_PRIVATE:-}
      # Optional file appenders only; stdout is the log channel (ADR-0016). LOGS_DIR binds a host path.
      - ${LOGS_DIR:-logs}:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEM_LIMIT:-1g}
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
    ports:
      # The actuator only, on localhost only (ADR-0012, ADR-0017).
      - "127.0.0.1:${ACTUATOR_HOST_PORT:?ACTUATOR_HOST_PORT is set in _docker-compose.instance.env}:8080"
    networks:
      default:
        # Other containers (the test stack's it-runner) reach the app by its AppName.
        aliases:
          - ${APP_NAME}
    labels:
      com.example.env: ${APP_ENV}
      com.example.flow: ${APP_FLOW}
      com.example.app: ${APP_NAME}
      com.example.instance: ${APP_INSTANCE}
      com.example.ci.run: "${CI_RUN_ID:-local}"
      com.example.ci.attempt: "${CI_RUN_ATTEMPT:-0}"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  logs:
    labels:
      com.example.ci.run: "${CI_RUN_ID:-local}"
      com.example.ci.attempt: "${CI_RUN_ATTEMPT:-0}"

networks:
  # The project network (also the test stack's default network, which base.yml labels the same way). With
  # DEPS_NETWORK (the network of a running dependency stack, ./gradlew devUp) run-compose.sh adds a generated
  # override that makes `default` that external network, so service names such as sqlserver and deephaven resolve.
  # No `external: ${...}` here: podman-compose reads an interpolated "false" as true.
  default:
    name: ${PROJECT:?run through run-compose.sh}_default
    labels:
      com.example.ci.run: "${CI_RUN_ID:-local}"
      com.example.ci.attempt: "${CI_RUN_ATTEMPT:-0}"
