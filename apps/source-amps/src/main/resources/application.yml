# Layer 1 — jar defaults of source-amps (ADR-0011): safe, environment-agnostic defaults and the import list.
# Everything environment-specific comes from the config tree, one file per layer mounted read-only (ADR-0011):
#   /config/flow/application.yml      <- config/<env>/<flow>/application.flow.yml   (optional; the cluster layer, ADR-0011)
#   /config/common/application.yml    <- config/<env>/<flow>/<AppName>/application.app.yml
#   /config/instance/application.yml  <- config/<env>/<flow>/<AppName>/<AppInstance>/application.instance.yml
# Later imports override earlier ones; /secrets/ (Kubernetes Secret, one file per property) comes last.
# Secrets are never set here (ADR-0013). Identity: APP_ENV, APP_FLOW, APP_NAME, APP_INSTANCE (environment).
spring:
  application:
    name: source-amps
  config:
    import:
      - optional:file:/config/flow/application.yml
      - optional:file:/config/common/application.yml
      - optional:file:/config/instance/application.yml
      - optional:configtree:/secrets/
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # appconfig: the masked configuration summary for `run-compose.sh ... app-config` (ADR-0016, ADR-0040).
        include: health,info,prometheus,appconfig
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          # The framework's `app` indicator gates readiness (ADR-0015, ADR-0040).
          include: readinessState,app
  info:
    java:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
  pattern:
    # The identity tuple on every plain-text line (ADR-0016); JSON formats carry it as fields (below).
    level: "%5p [${APP_ENV:local}/${APP_FLOW:none}/${APP_NAME:${spring.application.name}}/${APP_INSTANCE:none}]"
  structured:
    json:
      add:
        env: ${APP_ENV:local}
        flow: ${APP_FLOW:none}
        app: ${APP_NAME:${spring.application.name}}
        instance: ${APP_INSTANCE:none}

connector:
  source:
    poll-interval: 30s
  sink:
    type: stub
