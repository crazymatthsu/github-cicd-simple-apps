# The Helm chart of source-amps (ADR-0019): one release per AppInstance, named
# <AppName>-<AppInstance>, in the namespace of its flow (ADR-0003). A copy of the
# source-database chart that differs only in this file's name / description and image.repository.
apiVersion: v2
name: source-amps
description: >-
  source-amps connector (AMPS -> Deephaven): one release per AppInstance of the config tree, deployed by
  scripts/helm-deploy-instance.sh (ADR-0019) or, if the EKS design adopts it, Argo CD.
type: application
# Chart semver: bump when templates, values or the schema change. The running image is image.tag (the
# instance values or --set-string image.tag=<tag>), never appVersion.
version: 0.1.2
appVersion: "0.1.0"
home: https://github.com/crazymatthsu/github-cicd-simple-apps
sources:
  - https://github.com/crazymatthsu/github-cicd-simple-apps/tree/main/apps/source-amps
