# Layer 4 — the reference integration-test instance (ADR-0025): positions from SQL Server into Deephaven.
# Integration tests set IT_TABLE_PREFIX to isolate their target table (ADR-0025).
connector:
  source:
    database: positions
    table: dbo.positions
  sink:
    type: deephaven
    deephaven:
      table: ${IT_TABLE_PREFIX:}positions
