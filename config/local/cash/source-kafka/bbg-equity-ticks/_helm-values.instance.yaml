# Helm values layer 3 (ADR-0019) of local/cash/source-kafka/bbg-equity-ticks.
# image.tag equals IMAGE_TAG in the sibling _docker-compose.instance.env (config-lint check 4; in *-dev both declare `main`, ADR-0027);
# identity and the APP_* variables restate the directory path (config-lint check 4); app-facing variables
# only, never secrets (ADR-0013).
image:
  tag: "local"
identity:
  env: local
  flow: cash
  app: source-kafka
  instance: bbg-equity-ticks
env:
  APP_ENV: local
  APP_FLOW: cash
  APP_NAME: source-kafka
  APP_INSTANCE: bbg-equity-ticks
  JAVA_OPTS: "-XX:MaxRAMPercentage=60"
  LOG_LEVEL_ROOT: INFO
