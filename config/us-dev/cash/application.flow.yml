# Layer 2 — cluster-wide settings for every app of us-dev/cash (ADR-0011: one business flow in one env is
# one cluster; nothing is shared at the env level): JSON logs on stdout for the dev hosts (ADR-0016); the identity
# fields come from the jar defaults (logging.structured.json.add.*).
logging:
  structured:
    format:
      console: ecs
