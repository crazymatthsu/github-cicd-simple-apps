# Chart defaults = values layer 1 (ADR-0019). Layer 2 is config/<env>/<flow>/<AppName>/_helm-values.app.yaml,
# layer 3 config/<env>/<flow>/<AppName>/<AppInstance>/_helm-values.instance.yaml (ADR-0011)
# (later -f wins; maps deep-merge, lists are replaced). The application.<layer>.yml files arrive as file values
# (appConfig, appFiles). values.schema.json rejects unknown top-level keys and secret-bearing env names.
# The one deployer is scripts/helm-deploy-instance.sh (README.md has the flag list).

replicaCount: 1                       # one replica per instance for now
image:
  repository: __IMAGE_REPOSITORY__   # JFrog or the ECR mirror on EKS (ADR-0019)
  tag: ""                             # always set: instance values, --set-string image.tag=<tag> by the deployer
  digest: ""                          # optional pin for qa / prod (ADR-0010): renders repository@digest
  pullPolicy: IfNotPresent
imagePullSecrets: []                  # [{ name: <secret> }] for a private registry
serviceAccount:
  create: true                        # ServiceAccount <release>: Vault Kubernetes auth / IRSA identity (ADR-0019)
  name: ""                            # used only when create is false (empty: the namespace's default)
  annotations: {}                     # e.g. eks.amazonaws.com/role-arn (IRSA, the EKS design)
  automountToken: false               # the connector never calls the Kubernetes API
identity:                             # the instance values set all four (the config-tree path, ADR-0003):
  env: ""                             # rendered as platform.example.com/* labels, checked by the helm test;
  flow: ""                            # APP_ENV / APP_FLOW / APP_NAME / APP_INSTANCE in env must equal it
  app: ""                             # and app must be this chart's name
  instance: ""
env: {}                               # map -> container env (sorted by name); the instance values set APP_ENV,
                                      # APP_FLOW, APP_NAME, APP_INSTANCE, JAVA_OPTS, LOG_LEVEL_ROOT, the app layer TZ
appConfig: {}                         # flow | common | instance -> /config/<layer>/application.yml (--set-file)
appFiles: {}                          # <layer>: { <file name>: <content> } -> /config/<layer>/<file name> (--set-file)
secrets:
  existingSecret: ""                  # defaults to <release>-secrets; mounted at /secrets/ (ADR-0013)
  externalSecret:                     # the EKS design (ADR-0019): ESO renders the same Secret from Vault
    enabled: false
    storeRef: ""                      # default vault-<env>
    storeKind: ClusterSecretStore
    vaultPath: ""                     # default <env>/<flow>/<app>/<instance>
    refreshInterval: 1m
service:
  port: 8080                          # HTTP / actuator port: health, metrics (ADR-0009 EXPOSE 8080, ADR-0015)
probes:                               # paths and timings from ADR-0015
  startup: { path: /actuator/health/liveness, periodSeconds: 5, failureThreshold: 24, timeoutSeconds: 3 }   # 2-minute budget
  readiness: { path: /actuator/health/readiness, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3 }
  liveness: { path: /actuator/health/liveness, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 3 }
resources:
  requests: { cpu: 250m, memory: 1Gi }
  limits: { memory: 1Gi }             # requests == limits; the JVM heap is a percentage (JAVA_OPTS, ADR-0009)
strategy: { type: Recreate }          # single-consumer default; RollingUpdate only for idempotent pipelines
terminationGracePeriodSeconds: 30
# Restricted Pod Security Standard (ADR-0019). The image runs as 10001:10001 (ADR-0009); fsGroup lets that user read
# the 0400 files of the /secrets/ volume.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
tmp: { sizeLimit: 256Mi }             # emptyDir /tmp (read-only root filesystem, ADR-0017)
logs: { sizeLimit: 256Mi }            # emptyDir /app/logs (optional file appenders; stdout is the log channel)
data: { sizeLimit: 256Mi }            # emptyDir /app/data (what the app keeps; persistent storage awaits the EKS design)
topologySpread:                       # spread the instances of one app across zones
  enabled: true
  topologyKey: topology.kubernetes.io/zone
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
reloader: { enabled: false }          # Reloader annotation for the ESO-owned Secret
serviceMonitor:                       # Prometheus Operator (ADR-0015)
  enabled: false
  interval: 30s
  path: /actuator/prometheus
  labels: {}                          # extra labels the Prometheus serviceMonitorSelector expects
podDisruptionBudget:                  # rendered only when replicaCount > 1
  enabled: false
  maxUnavailable: 1
networkPolicy:                        # kind's default CNI does not enforce it, EKS does
  enabled: false
  ingressNamespaces: [monitoring]     # namespaces allowed to reach the http port (metrics scrape)
  egress: []                          # extra NetworkPolicyEgressRules besides DNS, e.g.
                                      # - { to: [{ ipBlock: { cidr: 10.20.0.0/16 } }], ports: [{ port: 1433 }] }
