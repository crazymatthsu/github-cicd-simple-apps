# test-infra/compose/it-runner.yml: the test JVM as a compose service (ADR-0025).
#
# CI runs the integration tests inside the ci-build image, or its public fallback when ci-build is not published
# (setup-build-env exports CI_BUILD_IMAGE, ADR-0033), on the stack network, so no port is published:
#   docker compose run --rm it-runner ./gradlew <project>:integrationTest -Pcompose.managed=false --no-daemon
# (COMPOSE_FILE, COMPOSE_PROJECT_NAME, COMPOSE_ENV_FILES and the IT_* values come from $GITHUB_ENV,
# written by `stack.sh up`.) The `tools` profile keeps `up --wait` from ever starting it.
x-ci-labels: &ci-labels
  com.example.ci.run: "${CI_RUN_ID:-local}"
  com.example.ci.attempt: "${CI_RUN_ATTEMPT:-0}"

services:
  it-runner:
    image: ${CI_BUILD_IMAGE:?CI_BUILD_IMAGE is not set - see test-infra/compose/versions.env}
    profiles: [tools]
    # The caller's UID/GID (stack.sh exports them): files the build writes into the bind-mounted
    # workspace stay owned by the runner user (UID 1001 on GitHub-hosted runners, as in the image).
    user: "${IT_RUNNER_UID:-1001}:${IT_RUNNER_GID:-1001}"
    init: true
    working_dir: /workspace
    environment:
      HOME: /tmp
      GRADLE_USER_HOME: /gradle-home
      # The run's prefix for target tables (ADR-0025).
      IT_TABLE_PREFIX: ${IT_TABLE_PREFIX:-}
      # The app under test when the stack includes it (ADR-0025): stack.sh up exports APP_IMAGE and APP_NAME,
      # the compose service name. Both stay empty for a stack without an app, and the actuator check skips.
      APP_IMAGE: ${APP_IMAGE:-}
      IT_APP_HOST: ${APP_NAME:-}
      IT_APP_PORT: "8080"
      # CI context passed through when set (version computation in build-logic, CI-only guards).
      CI:
      GITHUB_ACTIONS:
      GITHUB_REF:
      GITHUB_REF_NAME:
      GITHUB_HEAD_REF:
      GITHUB_SHA:
      GITHUB_RUN_ID:
      GITHUB_RUN_ATTEMPT:
      GITHUB_SERVER_URL:
      GITHUB_REPOSITORY:
      PR_NUMBER:
    # What the project's stacks publish to the tests (ADR-0038): the env entries of their stacks.yml declarations,
    # as a JVM on the stack network sees them (endpoints by service name, generated secrets), written by
    # `stack.sh up`. The environment above wins over them.
    env_file:
      - ${IT_RUNNER_ENV_FILE:?IT_RUNNER_ENV_FILE is not set - run test-infra/compose/stack.sh up first}
    volumes:
      - ${IT_WORKSPACE:-../..}:/workspace
      # Host Gradle home restored by setup-gradle, mounted read-write.
      - ${IT_GRADLE_HOME:-~/.gradle}:/gradle-home
    # Above the 1.2 GB first budgeted: gradle.properties gives the Gradle daemon -Xmx1536m, and the test JVM
    # and any Kotlin compile of build-logic come on top of that. Measure in CI and adjust.
    mem_limit: ${IT_RUNNER_MEM_LIMIT:-2g}
    labels: *ci-labels
